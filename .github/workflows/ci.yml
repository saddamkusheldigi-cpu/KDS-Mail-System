name: CI and Docker deploy to RHEL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test worker and application
        run: npm test

      - name: Check worker runner syntax
        run: node --check packages/email-worker/src/local-runner.js

      - name: Validate Docker Compose configuration
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
        run: |
          set -euo pipefail
          printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL" > .env.local
          trap 'rm -f .env.local' EXIT
          APP_UID=1000 APP_GID=1000 docker compose --env-file .env.local config --quiet

      - name: Build application
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: npm run build

  deploy-local:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, rhel9]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and deploy with Docker Compose
        run: |
          set -euo pipefail
          APP_DIR="/var/www/inbox-mailer"

          if ! command -v rsync >/dev/null || ! command -v curl >/dev/null; then
            sudo -n dnf install -y rsync curl
          fi
          if ! command -v docker >/dev/null || ! command -v dockerd >/dev/null || ! docker compose version >/dev/null 2>&1; then
            echo "Docker Engine or Compose is missing; installing Docker CE for RHEL."
            sudo -n dnf install -y dnf-plugins-core
            sudo -n dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
            sudo -n dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi
          command -v docker >/dev/null || { echo "Docker installation did not provide the docker CLI"; exit 1; }
          docker compose version
          if ! docker info >/dev/null 2>&1; then
            echo "Docker CLI found, but the daemon is not available; trying to enable and start docker.service."
            if ! sudo -n systemctl enable --now docker; then
              echo "Could not start Docker. Run 'sudo systemctl enable --now docker' on RHEL 9, then retry."
              exit 1
            fi
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker is still inaccessible. Add the runner service user to the docker group and restart the runner."
            exit 1
          fi
          test -d "$APP_DIR" && test -w "$APP_DIR" || {
            echo "$APP_DIR must exist and be writable by the self-hosted runner user"
            exit 1
          }
          test -f "$APP_DIR/.env.local" || {
            echo "Create $APP_DIR/.env.local with production settings before deploying"
            exit 1
          }

          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/.env*' \
            --exclude='*.db*' \
            --exclude='/.local-queue.json' \
            --exclude='/.local-db.json' \
            --exclude='/data/' \
            --exclude='/uploads/' \
            --exclude='/public/uploads/' \
            --exclude='/.next/cache/' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

          cd "$APP_DIR"
          mkdir -p data uploads cache
          if command -v pm2 >/dev/null; then
            pm2 delete inbox-mailer-web >/dev/null 2>&1 || true
            pm2 delete inbox-mailer-worker >/dev/null 2>&1 || true
            pm2 save
          fi
          docker compose --env-file .env.local down
          if [ -f inbox_mailer.db ] && [ ! -f data/inbox_mailer.db ]; then
            mv inbox_mailer.db data/inbox_mailer.db
            for sidecar in inbox_mailer.db-wal inbox_mailer.db-shm inbox_mailer.db-journal; do
              if [ -f "$sidecar" ]; then
                mv "$sidecar" data/
              fi
            done
          fi
          if [ -f .local-queue.json ] && [ ! -f data/.local-queue.json ]; then
            mv .local-queue.json data/.local-queue.json
          fi
          export APP_UID="$(id -u)"
          export APP_GID="$(id -g)"
          docker compose --env-file .env.local config --quiet
          docker compose --env-file .env.local up -d --build --remove-orphans
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3000/api/stats >/dev/null

  create-version-tag:
    needs: deploy-local
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create timestamp version tag
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created version tag: $TAG"
